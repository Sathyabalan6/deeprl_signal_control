[ENV_CONFIG]
clip_wave = 1000.0
clip_wait = 1000.0
control_interval_sec = 5
agent = ma2c
coop_gamma = 0.9
data_path = ./small_grid/data/
episode_length_sec = 300
norm_wave = 20.0
norm_wait = 20.0
coef_wait = 0.2
coef_ev = 5.0
num_extra_car_per_hour = 1000
objective = hybrid
scenario = small_grid
seed = 42
test_seeds = 10000
yellow_interval_sec = 2

[MODEL_CONFIG]
batch_size = 20
lr_init = 0.001
lr_decay = constant
lr_min = 0.00001
entropy_coef_init = 0.01
entropy_decay = constant
entropy_coef_min = 0.001
entropy_ratio = 0.5
value_coef = 0.1
max_grad_norm = 5.0
rmsp_alpha = 0.99
rmsp_epsilon = 1e-5
num_fw = 20
num_ft = 20
num_fp = 20
num_lstm = 64
reward_clip = 10.0
reward_norm = 20.0

[TRAIN_CONFIG]
total_step = 200
test_interval = 10000
log_interval = 20
